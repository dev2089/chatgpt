name: Build Android Remote Control MCP for Android 11

on:
  push:
    branches: [ android-remote-control-mcp-android11 ]
    paths:
      - ".github/workflows/build-android-remote-control-android11.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: danielealbano/android-remote-control-mcp
          path: upstream

      - name: Patch minimum Android version
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s2 = s.replace("minSdk = 33", "minSdk = 30", 1)
          if s2 == s:
              raise SystemExit("minSdk = 33 not found")
          p.write_text(s2)
          print("Patched minSdk 33 -> 30")
          PY

      - name: Build FOSS release APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PVERSION_NAME=1.12.0-android11 -PVERSION_CODE=20120000 assembleFossRelease

      - name: Show APK
        working-directory: upstream
        run: |
          ls -lh app/build/outputs/apk/foss/release/*.apk

      - name: Publish Android 11 build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android11-v1.12.0
          name: Android 11 compatible build (FOSS)
          prerelease: true
          generate_release_notes: false
          files: upstream/app/build/outputs/apk/foss/release/*.apk
          body: |
            Android 11 compatibility build of danielealbano/android-remote-control-mcp.
            This build changes only the app minSdk from 33 to 30. Runtime compatibility on Android 11 is not guaranteed by upstream.
